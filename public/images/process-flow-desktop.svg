    <rect x="-38" y="-30" width="68" height="52" rx="5" fill="none" stroke="#f4f4f0" stroke-width="4"/><path d="M-27-17h47M-27-4h34" stroke="#d3a441" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="23" r="18" fill="#0d1114" stroke="#e1b64f" stroke-width="5"/><path d="M36 35l13 13" stroke="#e1b64f" stroke-width="5" stroke-linecap="round"/>
