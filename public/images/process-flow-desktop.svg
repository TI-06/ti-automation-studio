    <circle cy="-92" r="22" fill="#e1b64f"/><text y="-85" text-anchor="middle" fill="#141414" font-family="system-ui,sans-serif" font-size="16" font-weight="800">03</text>
    <path d="M-35-27h25v14c7-2 14 3 14 11S-3 11-10 9v17h-25V5c-13 5-21-15-8-20 3-1 5-1 8 0zM10-27h25v21c13-5 21 15 8 20-3 1-5 1-8 0v12H10V9c-7 2-14-3-14-11s7-13 14-11z" fill="none" stroke="#e1b64f" stroke-width="4" stroke-linejoin="round"/>
