  <g font-family="'Noto Sans JP',system-ui,sans-serif" text-anchor="middle">
    <g fill="#f4f4f0" font-size="20" font-weight="800"><text x="130" y="278">相談</text><text x="360" y="278">現在の業務を確認</text><text x="590" y="278">改善案・仕様整理</text><text x="820" y="278">開発</text><text x="1050" y="278">テスト</text><text x="1280" y="278">納品・改善</text></g>
    <g fill="#c8c9c7" font-size="14">
      <text x="130" y="312"><tspan x="130" dy="0">いま困っていることを整理。</tspan><tspan x="130" dy="22">仕様未確定でも問題ありません。</tspan></text>
      <text x="360" y="312"><tspan x="360" dy="0">作業手順・入力データ・利用者・</tspan><tspan x="360" dy="22">例外ケースを確認します。</tspan></text>
      <text x="590" y="312"><tspan x="590" dy="0">作る機能と作らない部分を整理し、</tspan><tspan x="590" dy="22">無理のない構成にします。</tspan></text>
      <text x="820" y="312"><tspan x="820" dy="0">操作性と保守性を意識しながら、</tspan><tspan x="820" dy="22">小さく確認できる単位で実装。</tspan></text>
      <text x="1050" y="312"><tspan x="1050" dy="0">実際の業務パターンを想定し、</tspan><tspan x="1050" dy="22">入力・処理・エラー時まで確認。</tspan></text>
      <text x="1280" y="312"><tspan x="1280" dy="0">運用開始後も必要に応じて調整し、</tspan><tspan x="1280" dy="22">使い続けられる状態へ整えます。</tspan></text>
    </g>
  </g>
  <g transform="translate(46 402)">
    <rect width="1348" height="76" rx="14" fill="#101519" stroke="#32383c"/>
    <circle cx="38" cy="38" r="20" fill="none" stroke="#d3a441" stroke-width="2"/><path d="M38 24v19M29 36l9 9 9-9" stroke="#d3a441" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="34" fill="#e1b64f" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="18" font-weight="800">要件が曖昧でも大丈夫です。</text>
    <text x="74" y="57" fill="#c8c9c7" font-family="'Noto Sans JP',system-ui,sans-serif" font-size="14">ヒアリングを通して一緒に整理し、最適な形をご提案します。</text>
  </g>
</svg>
