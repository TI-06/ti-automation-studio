    <circle cy="-92" r="22" fill="#e1b64f"/><text y="-85" text-anchor="middle" fill="#141414" font-family="system-ui,sans-serif" font-size="16" font-weight="800">02</text>
    <rect x="-29" y="-35" width="48" height="68" rx="5" fill="none" stroke="#f4f4f0" stroke-width="4"/><path d="M-16-20h21M-16-5h16M-16 10h13" stroke="#d3a441" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="24" r="17" fill="#0d1114" stroke="#e1b64f" stroke-width="5"/><path d="M36 36l13 13" stroke="#e1b64f" stroke-width="5" stroke-linecap="round"/>
