  <!-- 06 -->
  <g transform="translate(1280 170)">
    <circle r="66" fill="#0d1114" stroke="#d3a441" stroke-width="3"/>
    <circle cy="-92" r="22" fill="#e1b64f"/><text y="-85" text-anchor="middle" fill="#141414" font-family="system-ui,sans-serif" font-size="16" font-weight="800">06</text>
    <path d="M-34-20L0-38l34 18L0-1zM-34-20v39L0 38V-1M34-20v39L0 38" fill="none" stroke="#e1b64f" stroke-width="4" stroke-linejoin="round"/>
