    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1438" height="518" rx="18" fill="#0a0d0f" stroke="#b98a2f" stroke-width="2"/>
  <path d="M170 170H1270" stroke="#d3a441" stroke-width="3" opacity=".65"/>
  <g fill="#d3a441" filter="url(#glow)">
    <path d="M271 160l16 10-16 10v-7h-28v-6h28z"/><path d="M501 160l16 10-16 10v-7h-28v-6h28z"/><path d="M731 160l16 10-16 10v-7h-28v-6h28z"/><path d="M961 160l16 10-16 10v-7h-28v-6h28z"/><path d="M1191 160l16 10-16 10v-7h-28v-6h28z"/>
  </g>

