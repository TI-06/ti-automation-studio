    <circle cy="-92" r="22" fill="#e1b64f"/><text y="-85" text-anchor="middle" fill="#141414" font-family="system-ui,sans-serif" font-size="16" font-weight="800">01</text>
    <path d="M-31-10h45a20 20 0 0120 20v7a20 20 0 01-20 20h-8l-15 13 3-13h-25a20 20 0 01-20-20v-7a20 20 0 0120-20z" fill="none" stroke="#f4f4f0" stroke-width="4" stroke-linejoin="round"/>
