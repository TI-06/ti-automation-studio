<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">API連携のビジュアル</title>
  <desc id="desc">複数のWebサービスが認証とデータ連携ハブを介して安全に同期するイメージ</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06090d"/><stop offset="1" stop-color="#0b1118"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1d99f"/><stop offset=".52" stop-color="#c8a96b"/><stop offset="1" stop-color="#7c6234"/></linearGradient>
    <linearGradient id="glass"><stop stop-color="#202630" stop-opacity=".96"/><stop offset="1" stop-color="#0d1218" stop-opacity=".91"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#c8a96b" stop-opacity=".34"/><stop offset="1" stop-color="#c8a96b" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".52"/></filter>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#c8a96b" opacity=".12"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#dots)"/>
  <ellipse cx="800" cy="450" rx="410" ry="350" fill="url(#glow)"/>
  <g stroke="#c8a96b" stroke-opacity=".15"><path d="M0 175H1600M0 725H1600M180 0V900M1420 0V900"/></g>

  <g filter="url(#shadow)">
