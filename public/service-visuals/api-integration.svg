    <path d="M135 8 252 76v138l-117 68L18 214V76z" fill="#10151d" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="135" cy="145" r="58" fill="none" stroke="#f0d59a" stroke-width="4" stroke-dasharray="8 10"/>
    <g transform="translate(103 95)" fill="none" stroke="#f0d59a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 0a27 27 0 1 1-17 48v29h34V48A27 27 0 1 1 32 0z"/>
      <circle cx="32" cy="24" r="5" fill="#f0d59a"/>
    </g>
    <path d="M106 204h58" stroke="#c8a96b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(670 95)" filter="url(#shadow)">
    <rect width="260" height="125" rx="16" fill="url(#glass)" stroke="#8a7345" stroke-opacity=".52"/>
    <circle cx="62" cy="62" r="28" fill="none" stroke="#e7cd91" stroke-width="5"/><path d="M62 34v20M62 70v20M34 62h20M70 62h20" stroke="#e7cd91" stroke-width="4"/>
    <rect x="115" y="34" width="112" height="14" rx="7" fill="#c8a96b" fill-opacity=".34"/><g fill="#f0d59a"><circle cx="128" cy="78" r="5"/><circle cx="150" cy="78" r="5"/><circle cx="172" cy="78" r="5"/><circle cx="194" cy="78" r="5"/></g>
  </g>

  <g fill="url(#gold)" opacity=".9"><rect x="570" y="334" width="36" height="20" rx="5"/><rect x="1000" y="334" width="36" height="20" rx="5"/><rect x="560" y="566" width="36" height="20" rx="5"/><rect x="1000" y="566" width="36" height="20" rx="5"/></g>
</svg>