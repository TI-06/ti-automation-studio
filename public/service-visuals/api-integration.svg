      <rect width="410" height="250" rx="18" fill="url(#glass)" stroke="#8a7345" stroke-opacity=".48"/>
      <path d="M40 82h92l20 26h196v92H40z" fill="#c8a96b" fill-opacity=".12" stroke="#c8a96b" stroke-opacity=".32"/>
      <g stroke="#cdbb92" stroke-opacity=".28"><path d="M64 134H322M64 166H294"/></g>
      <circle cx="340" cy="58" r="18" fill="none" stroke="#c8a96b" stroke-width="3"/><path d="M334 58h12" stroke="#c8a96b" stroke-width="3"/>
    </g>
    <g transform="translate(70 510)">
      <rect width="440" height="260" rx="18" fill="url(#glass)" stroke="#8a7345" stroke-opacity=".46"/>
      <rect x="24" y="24" width="392" height="42" rx="8" fill="#0a0e14"/>
      <g transform="translate(32 92)"><rect width="110" height="110" rx="12" fill="#c8a96b" fill-opacity=".12"/><path d="M30 82h50l16-40H46z" fill="none" stroke="#e7cd91" stroke-width="4"/><circle cx="55" cy="55" r="17" fill="none" stroke="#e7cd91" stroke-width="4"/></g>
      <g transform="translate(175 100)" stroke="#b8a67e" stroke-opacity=".26"><path d="M0 0H220M0 32H190M0 64H210M0 96H170"/></g>
    </g>
    <g transform="translate(1090 100)">
      <rect width="420" height="260" rx="18" fill="url(#glass)" stroke="#8a7345" stroke-opacity=".48"/>
      <g transform="translate(30 35)"><circle cx="70" cy="72" r="46" fill="#c8a96b" fill-opacity=".1" stroke="#c8a96b" stroke-opacity=".35"/><circle cx="70" cy="58" r="17" fill="#e7cd91" fill-opacity=".78"/><path d="M38 112c9-25 55-25 64 0" fill="none" stroke="#e7cd91" stroke-width="7" stroke-linecap="round"/></g>
      <g transform="translate(160 52)" stroke="#cdbb92" stroke-opacity=".26"><path d="M0 0H210M0 35H180M0 70H198M0 105H165M0 140H205"/></g>
    </g>
    <g transform="translate(1080 520)">
      <rect width="430" height="250" rx="18" fill="url(#glass)" stroke="#8a7345" stroke-opacity=".46"/>
      <g transform="translate(34 36)" fill="#c8a96b"><rect width="34" height="150" opacity=".34"/><rect x="58" y="62" width="34" height="88" opacity=".64"/><rect x="116" y="25" width="34" height="125"/><rect x="174" y="82" width="34" height="68" opacity=".5"/></g>
      <circle cx="330" cy="125" r="65" fill="none" stroke="#c8a96b" stroke-width="24" stroke-dasharray="95 70 55 120" transform="rotate(-90 330 125)"/>
    </g>
  </g>

  <g stroke="url(#gold)" stroke-width="3" fill="none" opacity=".88">
    <path d="M500 235C625 245 675 345 730 395"/><path d="M510 640C625 630 675 535 730 500"/>
    <path d="M870 395C945 335 980 235 1090 235"/><path d="M870 500C950 550 980 640 1080 645"/>
