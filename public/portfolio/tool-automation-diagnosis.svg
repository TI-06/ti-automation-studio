<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
<title id="t">業務自動化診断ツール</title><desc id="d">質問への回答から自動化適性と削減効果を算出する診断画面</desc>
<defs><linearGradient id="zg" x1="0" x2="1"><stop stop-color="#23194a"/><stop offset="1" stop-color="#13141d"/></linearGradient></defs>
<rect width="1440" height="900" fill="url(#zg)"/>
<text x="70" y="92" font-family="Arial,'Noto Sans JP',sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="start">AUTOMATION DIAGNOSIS</text><text x="70" y="137" font-family="Arial,'Noto Sans JP',sans-serif" font-size="28" font-weight="700" fill="#f4f1ff" text-anchor="start">作業内容から、自動化の可能性を診断</text>
<rect x="70" y="185" width="720" height="610" rx="20" fill="#fff"/>
<text x="105" y="230" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="700" fill="#7655cf" text-anchor="start">STEP 3 / 6</text>
<text x="105" y="280" font-family="Arial,'Noto Sans JP',sans-serif" font-size="23" font-weight="700" fill="#282532" text-anchor="start">この作業は、どのくらい繰り返しますか？</text>
<rect x="105" y="330" width="650" height="68" rx="14" fill="#f7f7f9" stroke="#e3e3e8" stroke-width="1"/><circle cx="140" cy="364" r="11" fill="#fff" stroke="#bcc1c7" stroke-width="2"/><text x="170" y="359" font-family="Arial,'Noto Sans JP',sans-serif" font-size="14" font-weight="700" fill="#35313e" text-anchor="start">毎日</text><text x="170" y="381" font-family="Arial,'Noto Sans JP',sans-serif" font-size="11" font-weight="500" fill="#80808b" text-anchor="start">週5回以上</text><rect x="105" y="418" width="650" height="68" rx="14" fill="#eee8ff" stroke="#8060d6" stroke-width="2"/><circle cx="140" cy="452" r="11" fill="#7655cf" stroke="#7655cf" stroke-width="2"/><text x="170" y="447" font-family="Arial,'Noto Sans JP',sans-serif" font-size="14" font-weight="700" fill="#35313e" text-anchor="start">週に数回</text><text x="170" y="469" font-family="Arial,'Noto Sans JP',sans-serif" font-size="11" font-weight="500" fill="#80808b" text-anchor="start">週2〜4回</text><rect x="105" y="506" width="650" height="68" rx="14" fill="#f7f7f9" stroke="#e3e3e8" stroke-width="1"/><circle cx="140" cy="540" r="11" fill="#fff" stroke="#bcc1c7" stroke-width="2"/><text x="170" y="535" font-family="Arial,'Noto Sans JP',sans-serif" font-size="14" font-weight="700" fill="#35313e" text-anchor="start">月に数回</text><text x="170" y="557" font-family="Arial,'Noto Sans JP',sans-serif" font-size="11" font-weight="500" fill="#80808b" text-anchor="start">月2〜4回</text><rect x="105" y="594" width="650" height="68" rx="14" fill="#f7f7f9" stroke="#e3e3e8" stroke-width="1"/><circle cx="140" cy="628" r="11" fill="#fff" stroke="#bcc1c7" stroke-width="2"/><text x="170" y="623" font-family="Arial,'Noto Sans JP',sans-serif" font-size="14" font-weight="700" fill="#35313e" text-anchor="start">不定期</text><text x="170" y="645" font-family="Arial,'Noto Sans JP',sans-serif" font-size="11" font-weight="500" fill="#80808b" text-anchor="start">必要なときだけ</text>
<rect x="105" y="710" width="145" height="44" rx="10" fill="#f1eff6"/><text x="178" y="738" font-family="Arial,'Noto Sans JP',sans-serif" font-size="13" font-weight="700" fill="#5b536b" text-anchor="middle">← 戻る</text>
<rect x="610" y="710" width="145" height="44" rx="10" fill="#7655cf"/><text x="682" y="738" font-family="Arial,'Noto Sans JP',sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">次へ →</text>
<rect x="835" y="185" width="535" height="610" rx="20" fill="#151427" stroke="#3d3567"/>
<text x="875" y="230" font-family="Arial,'Noto Sans JP',sans-serif" font-size="16" font-weight="700" fill="#e5e0f5" text-anchor="start">診断結果プレビュー</text>
<circle cx="1100" cy="390" r="116" fill="none" stroke="#2a2740" stroke-width="25"/>
<path d="M1100 274 A116 116 0 1 1 1002 452" fill="none" stroke="#8d6ef0" stroke-width="25" stroke-linecap="round"/>
<text x="1100" y="375" font-family="Arial,'Noto Sans JP',sans-serif" font-size="13" font-weight="600" fill="#9990b3" text-anchor="middle">自動化適性</text><text x="1100" y="420" font-family="Arial,'Noto Sans JP',sans-serif" font-size="52" font-weight="700" fill="#f3efff" text-anchor="middle">82</text><text x="1100" y="450" font-family="Arial,'Noto Sans JP',sans-serif" font-size="14" font-weight="600" fill="#9990b3" text-anchor="middle">/ 100</text>
<rect x="875" y="545" width="220" height="125" rx="14" fill="#211d38"/><text x="900" y="580" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="600" fill="#968dad" text-anchor="start">年間削減時間</text><text x="900" y="625" font-family="Arial,'Noto Sans JP',sans-serif" font-size="29" font-weight="700" fill="#c4afff" text-anchor="start">108h</text>
<rect x="1115" y="545" width="220" height="125" rx="14" fill="#211d38"/><text x="1140" y="580" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="600" fill="#968dad" text-anchor="start">推奨方法</text><text x="1140" y="618" font-family="Arial,'Noto Sans JP',sans-serif" font-size="18" font-weight="700" fill="#e6e0f5" text-anchor="start">GAS / Python</text>
<text x="875" y="720" font-family="Arial,'Noto Sans JP',sans-serif" font-size="13" font-weight="500" fill="#b7afc9" text-anchor="start">高頻度・定型作業のため、自動化効果が見込めます。</text>
