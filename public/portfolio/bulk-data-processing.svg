="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="500" fill="#d2cbd8" text-anchor="start">A-001 </text><text x="535" y="606" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="500" fill="#d2cbd8" text-anchor="start">末尾空白</text><text x="820" y="606" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="700" fill="#62c98b" text-anchor="start">自動修正</text></g><g><line x1="100" y1="630" x2="950" y2="630" stroke="#302b39"/><text x="108" y="664" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="500" fill="#d2cbd8" text-anchor="start">1204</text><text x="180" y="664" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="500" fill="#d2cbd8" text-anchor="start">数量</text><text x="310" y="664" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="500" fill="#d2cbd8" text-anchor="start">-</text><text x="535" y="664" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="500" fill="#d2cbd8" text-anchor="start">数値変換不可</text><text x="820" y="664" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="700" fill="#f1a15b" text-anchor="start">要確認</text></g><g><line x1="100" y1="688" x2="950" y2="688" stroke="#302b39"/><text x="108" y="722" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="500" fill="#d2cbd8" text-anchor="start">3501</text><text x="180" y="722" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="500" fill="#d2cbd8" text-anchor="start">住所</text><text x="310" y="722" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="500" fill="#d2cbd8" text-anchor="start">東京都　千代田区</text><text x="535" y="722" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="500" fill="#d2cbd8" text-anchor="start">全角空白</text><text x="820" y="722" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="700" fill="#62c98b" text-anchor="start"