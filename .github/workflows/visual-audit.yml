name: Responsive Browser Audit

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/visual-audit.mjs'
      - '.github/workflows/visual-audit.yml'
  workflow_dispatch:

jobs:
  chromium-responsive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Install Chromium browser audit runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start Astro development server
        run: |
          (npm run dev -- --host 127.0.0.1 --port 4321 > /tmp/astro-visual.log 2>&1) &
          echo $! > /tmp/astro-visual.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4321/; then exit 0; fi
            sleep 2
          done
          cat /tmp/astro-visual.log
          exit 1
      - name: Check 320-1440px layout and interactions
        run: node scripts/visual-audit.mjs
      - name: Upload responsive screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-screenshots
          path: visual-audit-results
          if-no-files-found: warn
          retention-days: 14
      - name: Show dev-server logs on failure
        if: failure()
        run: cat /tmp/astro-visual.log || true
